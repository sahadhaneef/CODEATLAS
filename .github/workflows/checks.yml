name: foundation
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -r requirements-spikes.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: spikes/semantic/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: spikes/semantic
      - run: docker compose -p codeatlas-phase0-verify -f infra/compose/verify.yaml up -d --wait --wait-timeout 90
      - run: python scripts/wait_for_spikes.py
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python scripts/export_contracts.py --check
      - run: python -m pytest -q
        env:
          CODEATLAS_TEST_POSTGRES: postgresql+psycopg://codeatlas:local-development-only@127.0.0.1:55432/codeatlas?connect_timeout=5
          CODEATLAS_TEST_QDRANT: http://127.0.0.1:56333
          CODEATLAS_TEST_NEO4J: bolt://127.0.0.1:57687
          CODEATLAS_TEST_BROKER: redis://127.0.0.1:56379/0
      - if: always()
        run: docker compose -p codeatlas-phase0-verify -f infra/compose/verify.yaml down
