[build-system]
requires = ["setuptools==80.3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "codeatlas"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "sqlalchemy==2.0.40",
  "alembic==1.15.2", "psycopg[binary]==3.2.7", "pydantic==2.11.4",
  "PyJWT==2.10.1", "cryptography==44.0.3", "celery==5.5.2", "redis==5.2.1",
]

[tool.setuptools.packages.find]
where = ["services/api"]

[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".verification", ".storage"]

